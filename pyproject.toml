[project]
name = "lt-grid-pulse"
version = "0.1.0"
description = "Pipeline for Lithuanian grid, price and weather data: ingest, dbt models, dashboard"
readme = "README.md"
authors = [
    { name = "Art Sos", email = "arturas.sosnovskis@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "typer>=0.29.2",
]

[project.scripts]
lt-grid-pulse = "lt_grid_pulse.cli:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
